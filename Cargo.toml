[package]
name = "bluez-message"
version = "0.1.5"
edition = "2024"
rust-version = "1.91"
description = "iPhone SMS and calls on Linux over Bluetooth (BlueZ MAP/PBAP/HFP)"
license = "MIT"
repository = "https://github.com/morganorix/bluez-message"
readme = "README.md"
keywords = ["bluetooth", "bluez", "sms", "iphone", "hfp"]
categories = ["command-line-utilities", "gui", "os::linux-apis"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
# Short names are the local idiom (`n`, `c`, `s`…) in small parsing and drawing functions.
many_single_char_names = "allow"
# Flag-style state (call indicators, UI toggles) reads better as plain bools than as enums.
struct_excessive_bools = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
# Pixel coordinates: f64/usize → f32 conversions on small, bounded values.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
# Internal API, always called with the default hasher.
implicit_hasher = "allow"
# `assert!(x.is_empty())` reads better in tests than `assert_eq!(x, [] as [T; 0])`.
assert_is_empty = "allow"
# Fires inside zbus `#[interface]` expansions on unused D-Bus arguments (`_props`).
used_underscore_binding = "allow"

[profile.release]
overflow-checks = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
# Without `accesskit` (screen reader): one less D-Bus connection and fewer threads. The rest = eframe defaults;
# direct `winit` keeps its defaults (Wayland CSD, dynamic loading), which eframe's `winit/default` enabled.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "links", "wayland", "wgpu", "x11"], optional = true }
# SVG loader only (resvg without text: no system font is read).
egui_extras = { version = "0.36.2", default-features = false, features = ["svg"], optional = true }
futures-util = "0.3.34"
# Link preview thumbnails: pure Rust decoders only (already pulled in by egui_extras).
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
libc = "0.2.190"
# URL detection in SMS (clickable links): no dependency besides memchr.
linkify = { version = "0.11.0", optional = true }
notify-rust = { version = "4.18.2", optional = true }
phonenumber = "=0.3.10"
rusqlite = "0.32.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
# <head> of a linked page for its preview (title, description, image): no dependency.
tl = { version = "0.7.8", optional = true }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "io-util", "signal", "process", "net", "sync", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# Twemoji SVGs embedded in the binary: colour emojis without any system font.
# Link previews (GUI only, off by default): rustls + ring, Mozilla roots. Pinned: the resolver API
# (anti-SSRF filter) is in ureq's `unversioned` module.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"], optional = true }
twemoji-assets = { version = "1.5.1", default-features = false, features = ["svg"], optional = true }
# Already pulled in by egui: grapheme clusters (UAX #29) and emoji properties (UTS #51).
unicode-properties = { version = "0.1.4", default-features = false, features = ["emoji"], optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }
winit = { version = "0.30.13", optional = true }
zbus = "5"

[dev-dependencies]
# Headless egui tests (accessibility tree): widgets and menus checked without a display.
egui_kittest = "0.36.2"

[features]
notify = ["dep:notify-rust"]
gui = ["notify", "dep:eframe", "dep:egui_extras", "dep:image", "dep:linkify", "dep:tl", "dep:twemoji-assets", "dep:unicode-properties", "dep:unicode-segmentation", "dep:ureq", "dep:winit"]

[[bin]]
name = "bluez-msg"
path = "src/main.rs"

[[bin]]
name = "bluez-message"
path = "src/bin/bluez-message/main.rs"
required-features = ["gui"]

[[bin]]
name = "bluez-msg-call"
path = "src/bin/bluez-msg-call/main.rs"
required-features = ["gui"]

[[bin]]
name = "bluez-messaged"
path = "src/bin/bluez-messaged.rs"
required-features = ["notify"]
