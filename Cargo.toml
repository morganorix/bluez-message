[package]
name = "bluez-message"
version = "1.1.3"
edition = "2024"
rust-version = "1.91"
description = "iPhone SMS and calls on Linux over Bluetooth (BlueZ MAP/PBAP/HFP)"
license = "MIT"
repository = "https://github.com/morganorix/bluez-message"
readme = "README.md"
keywords = ["bluetooth", "bluez", "sms", "iphone", "hfp"]
categories = ["command-line-utilities", "gui", "os::linux-apis"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
# Short names are the local idiom (`n`, `c`, `s`…) in small parsing and drawing functions.
many_single_char_names = "allow"
# Flag-style state (call indicators, UI toggles) reads better as plain bools than as enums.
struct_excessive_bools = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
# Pixel coordinates: f64/usize → f32 conversions on small, bounded values.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
# Internal API, always called with the default hasher.
implicit_hasher = "allow"
# `assert!(x.is_empty())` reads better in tests than `assert_eq!(x, [] as [T; 0])`.
assert_is_empty = "allow"
# Fires inside zbus `#[interface]` expansions on unused D-Bus arguments (`_props`).
used_underscore_binding = "allow"

[profile.release]
overflow-checks = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
# Export folder: XDG `Download` directory from `user-dirs.dirs`.
dirs = "7.0.0"
# Without `accesskit` (screen reader): one less D-Bus connection and fewer threads. The rest = eframe defaults;
# direct `winit` keeps its defaults (Wayland CSD, dynamic loading), which eframe's `winit/default` enabled.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "links", "wayland", "wgpu", "x11"], optional = true }
# SVG loader only (resvg without text: no system font is read).
egui_extras = { version = "0.36.2", default-features = false, features = ["svg"], optional = true }
futures-util = "0.3.34"
# Link preview thumbnails: pure Rust decoders only (already pulled in by egui_extras).
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
libc = "0.2.190"
# URL detection in SMS (clickable links): no dependency besides memchr.
linkify = { version = "0.11.0", optional = true }
phonenumber = "=0.3.10"
rusqlite = "0.32.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
# <head> of a linked page for its preview (title, description, image): no dependency.
tl = { version = "0.7.8", optional = true }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "io-util", "signal", "process", "net", "sync", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# Twemoji SVGs embedded in the binary: colour emojis without any system font.
twemoji-assets = { version = "1.5.1", default-features = false, features = ["svg"], optional = true }
# Already pulled in by egui: grapheme clusters (UAX #29) and emoji properties (UTS #51).
unicode-properties = { version = "0.1.4", default-features = false, features = ["emoji"], optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }
# Link previews (GUI only, off by default): rustls + ring, Mozilla roots. Pinned: the resolver API
# (anti-SSRF filter) is in ureq's `unversioned` module.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"], optional = true }
winit = { version = "0.30.13", optional = true }
zbus = "6"

[dev-dependencies]
# Headless egui tests (accessibility tree): widgets and menus checked without a display.
egui_kittest = "0.36.2"

[features]
notify = []
gui = ["notify", "dep:eframe", "dep:egui_extras", "dep:image", "dep:linkify", "dep:tl", "dep:twemoji-assets", "dep:unicode-properties", "dep:unicode-segmentation", "dep:ureq", "dep:winit"]

[[bin]]
name = "bluez-msg"
path = "src/main.rs"

[[bin]]
name = "bluez-message"
path = "src/bin/bluez-message/main.rs"
required-features = ["gui"]

[[bin]]
name = "bluez-msg-call"
path = "src/bin/bluez-msg-call/main.rs"
required-features = ["gui"]

[[bin]]
name = "bluez-messaged"
path = "src/bin/bluez-messaged.rs"
required-features = ["notify"]

# ============================================================
# Packaging — Debian/Ubuntu (.deb via `cargo deb`)
# ============================================================
[package.metadata.deb]
maintainer = "morganorix <4254819+morganorix@users.noreply.github.com>"
copyright = "2026 morganorix"
license-file = ["LICENSE", "0"]
section = "net"
priority = "optional"
# Build all four binaries (gui feature also enables `notify`).
features = ["gui"]
extended-description = "iPhone SMS and calls on Linux over Bluetooth, using the BlueZ MAP/PBAP/HFP profiles (via bluez-obex and PipeWire Telephony). egui desktop UI plus a background user daemon."
# `$auto` keeps cargo-deb's auto-detected shared-lib deps (libsqlite3, libc, ...);
# the rest are dlopen'd (winit/wgpu) or runtime services, invisible to the scanner.
depends = "$auto, bluez, bluez-obexd, pipewire, wireplumber, libxkbcommon0, libwayland-client0, libvulkan1, libx11-6, libxcursor1, libxi6, libxrandr2"
recommends = "mesa-vulkan-drivers"
maintainer-scripts = "packaging/debian/"
assets = [
  ["target/release/bluez-msg",        "usr/bin/",                                                       "755"],
  ["target/release/bluez-messaged",   "usr/bin/",                                                       "755"],
  ["target/release/bluez-message",    "usr/bin/",                                                       "755"],
  ["target/release/bluez-msg-call",   "usr/bin/",                                                       "755"],
  ["packaging/arch/bluez-messaged.service",        "usr/lib/systemd/user/bluez-messaged.service",                    "644"],
  ["packaging/arch/bluez-message.desktop",         "usr/share/applications/bluez-message.desktop",                   "644"],
  ["packaging/arch/bluez-message.svg",             "usr/share/icons/hicolor/scalable/apps/bluez-message.svg",        "644"],
  ["packaging/arch/52-bluez-message-roles.conf",   "usr/share/wireplumber/wireplumber.conf.d/52-bluez-message-roles.conf",     "644"],
  ["packaging/arch/53-bluez-message-call-gain.conf","usr/share/wireplumber/wireplumber.conf.d/53-bluez-message-call-gain.conf","644"],
  ["packaging/arch/bluez-message-call-gain.lua",   "usr/share/wireplumber/scripts/bluez-message-call-gain.lua",      "644"],
  ["assets/mdi/LICENSE",     "usr/share/doc/bluez-message/mdi/LICENSE",     "644"],
  ["assets/mdi/NOTICE",      "usr/share/doc/bluez-message/mdi/NOTICE",      "644"],
  ["assets/twemoji/NOTICE",  "usr/share/doc/bluez-message/twemoji/NOTICE",  "644"],
  ["README.md",              "usr/share/doc/bluez-message/README.md",       "644"],
]

# ============================================================
# Packaging — Fedora/RHEL (.rpm via `cargo generate-rpm`)
# Build first:  cargo build --release --features gui
# ============================================================
[package.metadata.generate-rpm]
summary = "iPhone SMS and calls on Linux over Bluetooth (BlueZ MAP/PBAP/HFP)"
# Linked libs (libsqlite3, libc) are auto-detected; these are the dlopen'd libs
# and the runtime services the scanner cannot see.
requires = { bluez = "*", "bluez-obexd" = "*", pipewire = "*", wireplumber = "*", libxkbcommon = "*", "libwayland-client" = "*", "vulkan-loader" = "*", libX11 = "*", libXcursor = "*", libXi = "*", libXrandr = "*" }
post_install_script = "systemctl --global enable bluez-messaged.service >/dev/null 2>&1 || true"
pre_uninstall_script = "[ \"$1\" = 0 ] && systemctl --global disable bluez-messaged.service >/dev/null 2>&1 || true"

[[package.metadata.generate-rpm.assets]]
source = "target/release/bluez-msg"
dest = "/usr/bin/bluez-msg"
mode = "755"
[[package.metadata.generate-rpm.assets]]
source = "target/release/bluez-messaged"
dest = "/usr/bin/bluez-messaged"
mode = "755"
[[package.metadata.generate-rpm.assets]]
source = "target/release/bluez-message"
dest = "/usr/bin/bluez-message"
mode = "755"
[[package.metadata.generate-rpm.assets]]
source = "target/release/bluez-msg-call"
dest = "/usr/bin/bluez-msg-call"
mode = "755"
[[package.metadata.generate-rpm.assets]]
source = "packaging/arch/bluez-messaged.service"
dest = "/usr/lib/systemd/user/bluez-messaged.service"
mode = "644"
[[package.metadata.generate-rpm.assets]]
source = "packaging/arch/bluez-message.desktop"
dest = "/usr/share/applications/bluez-message.desktop"
mode = "644"
[[package.metadata.generate-rpm.assets]]
source = "packaging/arch/bluez-message.svg"
dest = "/usr/share/icons/hicolor/scalable/apps/bluez-message.svg"
mode = "644"
[[package.metadata.generate-rpm.assets]]
source = "packaging/arch/52-bluez-message-roles.conf"
dest = "/usr/share/wireplumber/wireplumber.conf.d/52-bluez-message-roles.conf"
mode = "644"
[[package.metadata.generate-rpm.assets]]
source = "packaging/arch/53-bluez-message-call-gain.conf"
dest = "/usr/share/wireplumber/wireplumber.conf.d/53-bluez-message-call-gain.conf"
mode = "644"
[[package.metadata.generate-rpm.assets]]
source = "packaging/arch/bluez-message-call-gain.lua"
dest = "/usr/share/wireplumber/scripts/bluez-message-call-gain.lua"
mode = "644"
[[package.metadata.generate-rpm.assets]]
source = "LICENSE"
dest = "/usr/share/licenses/bluez-message/LICENSE"
mode = "644"
