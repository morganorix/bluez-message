# cargo-deny: `cargo deny check` (advisories, licenses, bans, sources).
[graph]
all-features = true

[advisories]
ignore = [
    # atomic-polyfill: unmaintained (no vulnerability), build-dependency of phonenumber (postcard, heapless 0.7).
    { id = "RUSTSEC-2023-0089", reason = "unmaintained, no known vulnerability; build-time only, through phonenumber" },
    # ttf-parser: unmaintained (no vulnerability), pulled by winit -> sctk-adwaita (CSD title bar font); no upgrade yet.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no known vulnerability; transitive through winit/sctk-adwaita" },
    # webpki-roots: bundled CA set that trusts distrusted emSign intermediates. Only reachable through the
    # optional "link previews" feature (ureq/rustls HTTPS metadata fetch; private addresses already refused).
    # Proper fix: `cargo update -p webpki-roots` to a pruned release, then drop these two ignores.
    { id = "RUSTSEC-2026-0381", reason = "bundled CA roots; optional link-preview HTTPS only; resolve by updating webpki-roots" },
    { id = "RUSTSEC-2026-0382", reason = "bundled CA roots; optional link-preview HTTPS only; resolve by updating webpki-roots" },
]

[licenses]
# Permissive licenses actually present in the graph (MIT-compatible distribution).
# Dual-licensed crates (self_cell, r-efi) are accepted through their permissive option.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
