monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink hfp_hf ]
  bluez5.telephony-dbus-service = true
}

monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        # Pas de volume matériel en HFP/HSP : l'iPhone impose +VGS=2..4 (≈ -34 dB) au flux d'appel ;
        # le volume se règle côté PC.
        bluez5.hw-volume = [ a2dp_sink a2dp_source ]
      }
    }
  }
]
