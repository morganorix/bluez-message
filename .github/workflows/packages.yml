name: Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: Build .deb (Debian/Ubuntu)
    # Oldest reasonable baseline for glibc forward-compatibility.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libsqlite3-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build package
        run: cargo deb
      - name: Sign and checksum
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEYID: 0FC9047F715A691A8C0F1BFDCB996B67A2CEA2E0
        run: |
          set -euo pipefail
          export GNUPGHOME=$(mktemp -d); chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in target/debian/*.deb; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --local-user "$GPG_KEYID" --detach-sign "$f"
            ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" > "$(basename "$f").sha256" )
          done
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/*.deb*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/debian/*.deb*

  rpm:
    name: Build .rpm (Fedora)
    runs-on: ubuntu-latest
    container: fedora:40
    steps:
      - name: System build dependencies
        run: dnf install -y gcc pkgconf-pkg-config sqlite-devel libxkbcommon-devel wayland-devel rustup git findutils gnupg2
      - name: Rust toolchain via rustup (recent stable)
        run: |
          rustup-init -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Build (release, gui)
        run: cargo build --release --features gui
      - name: Strip binaries
        run: strip -s target/release/bluez-msg target/release/bluez-messaged target/release/bluez-message target/release/bluez-msg-call || true
      - name: Build package
        run: cargo generate-rpm
      - name: Sign and checksum
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEYID: 0FC9047F715A691A8C0F1BFDCB996B67A2CEA2E0
        run: |
          set -euo pipefail
          export GNUPGHOME=$(mktemp -d); chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in target/generate-rpm/*.rpm; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --local-user "$GPG_KEYID" --detach-sign "$f"
            ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" > "$(basename "$f").sha256" )
          done
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: target/generate-rpm/*.rpm*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/generate-rpm/*.rpm*

  arch:
    name: Build .pkg.tar.zst (Arch, signed)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: System dependencies
        run: |
          pacman -Syu --noconfirm --needed git sudo rust \
            sqlite bluez bluez-utils bluez-obex pipewire wireplumber \
            vulkan-icd-loader libxkbcommon wayland libx11 libxcursor libxi libxrandr
      - uses: actions/checkout@v4
      - name: Prepare build user (makepkg refuses root)
        run: |
          useradd -m builder
          cp -a "$GITHUB_WORKSPACE" /home/builder/pkg
          chown -R builder:builder /home/builder/pkg
      - name: Build package (makepkg, unsigned)
        run: |
          sudo -u builder bash -lc 'cd /home/builder/pkg/packaging/arch && makepkg --noconfirm --nocheck'
      - name: Sign, checksum and export public key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEYID: 0FC9047F715A691A8C0F1BFDCB996B67A2CEA2E0
        run: |
          set -euo pipefail
          dir=/home/builder/pkg/packaging/arch
          export GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          for pkg in "$dir"/*.pkg.tar.zst; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --local-user "$GPG_KEYID" --detach-sign "$pkg"
            ( cd "$dir" && sha256sum "$(basename "$pkg")" > "$(basename "$pkg").sha256" )
          done
          gpg --armor --export "$GPG_KEYID" > "$dir/bluez-message.asc"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$dir"/*.pkg.tar.zst "$dir"/*.pkg.tar.zst.sig "$dir"/*.pkg.tar.zst.sha256 "$dir/bluez-message.asc" "$GITHUB_WORKSPACE/dist/"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
